name: Build Briefcase pyBOAT Apps
on:
  workflow_dispatch:
  push:
    branches: [ 51_briefcase ]
  release:
    types: [created, edited]

permissions:
  contents: write

jobs:
  build-apps:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_path: "dist/*.msi"  # <-- Point directly to dist/
          - os: macos-latest
            artifact_path: "dist/*.dmg"  # <-- Point directly to dist/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Build Packages
        run: briefcase package --adhoc-sign

      - name: Upload Private Test Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pyBOAT-${{ matrix.os }}
          path: dist/
          if_no_files_found: error

      - name: Upload Installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

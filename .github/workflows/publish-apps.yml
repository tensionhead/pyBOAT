name: Build Briefcase pyBOAT Apps
on:
  workflow_dispatch:
  push:
    branches: [ 51_briefcase ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apps:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            name: windows
            artifact_path: "dist/*.msi"  # <-- Point directly to dist/
          - os: macos-latest
            name: apple-silicon
            artifact_path: "dist/*.dmg"
          - os: macos-13
            name: apple-intel
            artifact_path: "dist/*.dmg"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Build Packages
        run: briefcase package --adhoc-sign
        
      # Prevents collision on macOS by appending -apple-silicon 
      # or -apple-intel to the DMG
      - name: Rename macOS installer with architecture
        if: runner.os == 'macOS'
        run: |
          for f in dist/*.dmg; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.dmg}-${{ matrix.name }}.dmg"
          done
          
      - name: Upload Private Test Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pyBOAT-${{ matrix.name }}
          path: dist/
          if_no_files_found: error

      - name: Upload Installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish Standalone pyBOAT Apps
on:
  push:
    branches: [ 51_briefcase ]
#  release:
#    types: [published]

jobs:
  build-apps:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_path: "windows/msi/pyBOAT/pyBOAT-*.msi"
          - os: macos-latest
            artifact_path: "macOS/dmg/pyBOAT-*.dmg"
          - os: ubuntu-latest
            artifact_path: "linux/appimage/pyBOAT-*.AppImage"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase pytest

      - name: Run Pytest Regression Suite
        run: python -m pytest -vs
	    env:
          PYTHONPATH: .

      - name: Package Application
        run: briefcase package --no-sign

      - name: Upload Private Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyBOAT-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      # - name: Upload Installer to GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: ${{ matrix.artifact_path }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
